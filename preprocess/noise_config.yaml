# Noise augmentation configuration for train-whisper.py
# Pass this file with: --noise_config preprocess/noise_config.yaml
#
# Keys can be written with or without the 'noise_' prefix (both accepted).
# Any key omitted here falls back to the default shown in the comment.

# -- Required ------------------------------------------------------------------

# Directory containing your noise clips (wav/flac/mp3/ogg/m4a, subdirs ok).
# AddBackgroundNoise handles windowing/looping internally, so clip length
# doesn't need to match utterance length.
noise_dir: /Users/Shared/asr/noise_input_16khz

# -- Mixing --------------------------------------------------------------------

# Fraction of training examples that get noise applied at all.
# 0.6 -> 60% noisy, 40% clean. Model still sees clean speech regularly.
apply_prob: 0.6

# Signal-to-Noise Ratio range in dB, sampled uniformly per example.
# Lower = louder noise.  4 dB is already quite harsh; 25 dB is subtle.
snr_db_range: [4.0, 25.0]

# Random +/- gain jitter (dB) applied to each noise clip before SNR scaling.
# Prevents the model from memorising exact clip amplitudes.
gain_jitter_db: 3.0

# -- Per-clip perturbation -----------------------------------------------------

# Probability that a picked clip gets time-stretch + pitch-shift applied.
# 0.3 -> 30% of clips are slightly perturbed. Keep low: goal is variety, not distortion.
perturb_prob: 0.3

# How much to speed up / slow down the noise clip (1.0 = no change).
time_stretch_range: [0.97, 1.03]

# Pitch shift in semitones applied to the noise clip.
pitch_shift_semitone_range: [-0.5, 0.5]

# -- Radio channel simulation --------------------------------------------------

# Set to true to apply bandpass filter + optional tanh soft-clip to the
# mixed signal, approximating a radio/walkie-talkie channel response.
simulate_radio_channel: false

# Bandpass cutoff frequencies (Hz). Converted to center+bandwidth internally.
radio_band_hz: [50.0, 4000.0]

# tanh soft-clip drive. >1.0 enables clipping (simulates radio AGC squashing peaks).
# 1.0 = disabled.
radio_clip_drive: 1.0
